[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "donanimhaber-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for donanimhaber.com tech news and forum (latest, search, article, sections, hot topics)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
donanimhaber-mcp = "donanimhaber_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/donanimhaber_mcp"]
